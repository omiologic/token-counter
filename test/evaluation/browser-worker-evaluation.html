<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>Browser worker evaluation</title>
  </head>
  <body>
    <pre>browser-worker-evaluation-running</pre>
    <script type="module">
      const originalFetch = globalThis.fetch;
      const originalConsole = {};
      let consoleCalls = 0;
      for (const method of ["debug", "error", "info", "log", "warn"]) {
        originalConsole[method] = console[method];
        console[method] = () => {
          consoleCalls += 1;
        };
      }

      const report = async (result) => {
        Object.assign(console, originalConsole);
        globalThis.fetch = originalFetch;
        await originalFetch("/__worker_evaluation_result__", {
          body: JSON.stringify(result),
          headers: { "content-type": "application/json" },
          method: "POST",
        });
      };
      const deny = () => {
        throw new Error("Runtime capability denied by evaluation.");
      };
      const memory = () => performance.memory?.usedJSHeapSize ?? null;
      const aggregateMemory = async () => {
        if (typeof performance.measureUserAgentSpecificMemory === "function") {
          const result = await performance.measureUserAgentSpecificMemory();
          return { bytes: result.bytes, source: "measureUserAgentSpecificMemory" };
        }
        return { bytes: memory(), source: "performance.memory" };
      };
      const materialize = (input) => {
        if (input.kind === "literal") return input.text;
        if (input.kind === "repeat") return input.text.repeat(input.repetitions);
        if (input.kind === "numbered-lines") {
          return Array.from(
            { length: input.lines },
            (_, index) =>
              `row-${index}: alpha-${index % 17}, beta-${(index * 7) % 101}\n`,
          ).join("");
        }
        throw new Error("Unsupported fixture recipe.");
      };
      const median = (values) => {
        const sorted = [...values].sort((left, right) => left - right);
        return sorted[Math.floor(sorted.length / 2)];
      };
      const heartbeat = async (operation) => {
        const gaps = [];
        let previous = performance.now();
        const timer = setInterval(() => {
          const current = performance.now();
          gaps.push(current - previous);
          previous = current;
        }, 5);
        await new Promise((resolve) => setTimeout(resolve, 25));
        gaps.length = 0;
        previous = performance.now();
        const started = performance.now();
        const value = await operation();
        const operationMilliseconds = performance.now() - started;
        await new Promise((resolve) => setTimeout(resolve, 25));
        clearInterval(timer);
        return {
          heartbeat_max_gap_milliseconds: Math.max(...gaps),
          operation_milliseconds: operationMilliseconds,
          value,
        };
      };

      let worker;
      try {
        const fixtureData = await originalFetch("/fixtures/token-counts.json").then(
          (response) => response.json(),
        );
        const memoryBefore = await aggregateMemory();
        const mainStarted = performance.now();
        const main = await import("/main.js");
        const mainInitializationMilliseconds = performance.now() - mainStarted;
        const memoryAfterMainInitialization = await aggregateMemory();

        const workerStarted = performance.now();
        worker = new Worker("/worker.js", { type: "module" });
        let requestSequence = 0;
        const pending = new Map();
        const ready = new Promise((resolve, reject) => {
          worker.addEventListener("error", () =>
            reject(new Error("Worker initialization failed.")),
          );
          worker.addEventListener("message", (event) => {
            if (event.data?.ready === true) {
              resolve(event.data);
              return;
            }
            const request = pending.get(event.data?.id);
            if (request === undefined) return;
            pending.delete(event.data.id);
            request.resolve(event.data);
          });
        });
        const workerReady = await ready;
        const workerInitializationMilliseconds = performance.now() - workerStarted;
        const memoryAfterWorkerInitialization = await aggregateMemory();
        const send = (message) =>
          new Promise((resolve) => {
            const id = requestSequence;
            requestSequence += 1;
            pending.set(id, { resolve });
            worker.postMessage({ ...message, id });
          });

        await originalFetch("/__worker_evaluation_checkpoint__");
        globalThis.fetch = deny;
        if (globalThis.XMLHttpRequest) globalThis.XMLHttpRequest.prototype.open = deny;
        globalThis.WebSocket = deny;
        globalThis.EventSource = deny;
        if (globalThis.Navigator?.prototype?.sendBeacon) {
          globalThis.Navigator.prototype.sendBeacon = deny;
        }
        if (globalThis.Storage?.prototype?.setItem) {
          globalThis.Storage.prototype.setItem = deny;
        }
        if (globalThis.indexedDB?.open) globalThis.indexedDB.open = deny;
        if (globalThis.caches?.open) globalThis.caches.open = deny;

        let parityChecks = 0;
        for (const fixture of fixtureData.fixtures) {
          const text = materialize(fixture.input);
          const mainCount = main.count(text);
          const workerResponse = await send({ operation: "count", text });
          if (
            mainCount !== fixture.expected.o200k_base ||
            workerResponse.ok !== true ||
            workerResponse.count !== mainCount
          ) {
            throw new Error("Parity failed.");
          }
          parityChecks += 1;
        }

        const privateMarker = "private-browser-worker-evaluation-marker";
        const invalidResponse = await send({
          operation: "count",
          text: { privateMarker },
        });
        if (
          invalidResponse.ok !== false ||
          invalidResponse.error !== "Token counting failed." ||
          JSON.stringify(invalidResponse).includes(privateMarker)
        ) {
          throw new Error("Worker exposed a content-bearing failure.");
        }

        const workloadFixture = fixtureData.fixtures.find(
          ({ id }) => id === "large-nonrepeated",
        );
        const workload = materialize(workloadFixture.input);
        const iterations = 12;
        const mainDurations = [];
        const mainResponsiveness = await heartbeat(async () => {
          let count = 0;
          for (let index = 0; index < iterations; index += 1) {
            const started = performance.now();
            count = main.count(workload);
            mainDurations.push(performance.now() - started);
          }
          return count;
        });

        const workerCountingDurations = [];
        const workerRoundTripDurations = [];
        const workerResponsiveness = await heartbeat(async () => {
          let count = 0;
          for (let index = 0; index < iterations; index += 1) {
            const started = performance.now();
            const response = await send({ operation: "count", text: workload });
            workerRoundTripDurations.push(performance.now() - started);
            if (response.ok !== true) throw new Error("Worker count failed.");
            workerCountingDurations.push(response.counting_milliseconds);
            count = response.count;
          }
          return count;
        });
        if (
          mainResponsiveness.value !== workloadFixture.expected.o200k_base ||
          workerResponsiveness.value !== workloadFixture.expected.o200k_base
        ) {
          throw new Error("Workload count diverged.");
        }

        const workerMetrics = await send({ operation: "metrics" });
        if (
          workerMetrics.ok !== true ||
          workerReady.console_calls !== 0 ||
          workerMetrics.console_calls !== 0 ||
          consoleCalls !== 0
        ) {
          throw new Error("Unexpected console output.");
        }
        const memoryAfterEvaluation = await aggregateMemory();
        worker.terminate();
        worker = undefined;

        await report({
          initialization: {
            main_milliseconds: mainInitializationMilliseconds,
            worker_milliseconds: workerInitializationMilliseconds,
          },
          memory: {
            aggregate_after_evaluation_bytes: memoryAfterEvaluation.bytes,
            aggregate_after_main_initialization_bytes:
              memoryAfterMainInitialization.bytes,
            aggregate_after_worker_initialization_bytes:
              memoryAfterWorkerInitialization.bytes,
            aggregate_before_bytes: memoryBefore.bytes,
            aggregate_source: memoryBefore.source,
            worker_after_evaluation_bytes: workerMetrics.memory_bytes,
            worker_ready_bytes: workerReady.memory_bytes,
          },
          parity_checks: parityChecks,
          responsiveness: {
            iterations,
            main: {
              count_milliseconds_median: median(mainDurations),
              heartbeat_max_gap_milliseconds:
                mainResponsiveness.heartbeat_max_gap_milliseconds,
              operation_milliseconds: mainResponsiveness.operation_milliseconds,
            },
            worker: {
              count_milliseconds_median: median(workerCountingDurations),
              heartbeat_max_gap_milliseconds:
                workerResponsiveness.heartbeat_max_gap_milliseconds,
              operation_milliseconds: workerResponsiveness.operation_milliseconds,
              round_trip_milliseconds_median: median(workerRoundTripDurations),
              transfer_and_dispatch_milliseconds_median: median(
                workerRoundTripDurations.map(
                  (value, index) => value - workerCountingDurations[index],
                ),
              ),
            },
          },
        });
      } catch {
        worker?.terminate();
        await report({ failed: true });
      }
    </script>
  </body>
</html>
